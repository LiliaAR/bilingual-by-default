name: i18n parity

on:
  # No `paths:` filter on purpose: this is a REQUIRED check in the branch ruleset,
  # and a required check that is skipped leaves the PR stuck on "Expected".
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1-5"   # weekdays 09:00 UTC: catch drift on main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: EN/FR parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check EN/fr-CA parity
        run: node scripts/check-parity.mjs
      - name: Unit tests
        run: node --test "test/**/*.test.mjs"
